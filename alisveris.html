<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interaktif Alışveriş Listesi</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* CSS Print Setup for Exact A4 Landscape Fitting */
        @page {
            size: A4 landscape;
            margin: 0;
        }

        @media print {
            html, body {
                width: 297mm;
                height: 210mm;
                margin: 0;
                padding: 0;
                background: #ffffff !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            .no-print {
                display: none !important;
            }
            .page-container {
                box-shadow: none !important;
                padding: 12mm 15mm !important;
                width: 297mm !important;
                height: 210mm !important;
                max-width: 297mm !important;
                max-height: 210mm !important;
                border-radius: 0 !important;
            }
            /* Hide placeholders on print */
            input::placeholder, textarea::placeholder {
                color: transparent !important;
            }
            /* Clean input backgrounds on print */
            input, textarea {
                background: transparent !important;
                border-bottom-color: #cbd5e1 !important;
            }
        }

        /* Standard A4 Landscape Dimensions Preview */
        .page-container {
            width: 100%;
            max-width: 1120px; /* Equivalent to A4 aspect ratio in desktop viewing */
            min-height: 790px;
            box-sizing: border-box;
            background-color: #ffffff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        /* Category Card Hover & Transition Effects */
        .category-card {
            transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }

        .category-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px -2px rgba(0, 0, 0, 0.08);
            border-color: #a7f3d0;
        }

        /* Zoom / Focus Mode Modal Styling */
        #zoom-modal-backdrop {
            transition: opacity 0.25s ease-in-out;
        }

        #zoom-card-container {
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.2s ease-in-out;
        }

        /* Dotted line styling for input fields */
        .item-input {
            border-bottom: 1px dotted #cbd5e1;
            transition: all 0.2s ease;
        }

        .item-input:focus-within {
            border-bottom-color: #059669;
            background-color: #f0fdf4;
        }

        /* Checked state line-through */
        .item-checked {
            text-decoration: line-through;
            color: #94a3b8 !important;
        }

        /* Custom scrollbar for modern feel */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center justify-start p-2 sm:p-4 md:p-6 text-slate-800">

    <!-- Action Bar / Web Utility Header -->
    <div class="no-print w-full max-w-[1120px] mb-4 flex flex-wrap items-center justify-between gap-3 bg-white p-4 rounded-xl shadow-sm border border-slate-200">
        <div class="flex items-center gap-2">
            <span class="text-2xl">🛒</span>
            <div>
                <h1 class="text-lg font-bold text-slate-800 leading-tight">Alışveriş Listem</h1>
                <p class="text-xs text-slate-500">Değişiklikler anlık olarak tarayıcınıza kaydedilir.</p>
            </div>
        </div>
        <div class="flex items-center gap-2 sm:gap-3 flex-wrap">
            <button onclick="clearAllData()" class="px-4 py-2 bg-slate-100 hover:bg-rose-50 text-slate-600 hover:text-rose-600 text-sm font-semibold rounded-lg transition-all flex items-center gap-1.5 cursor-pointer border border-slate-200 hover:border-rose-200">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                </svg>
                Tümünü Temizle
            </button>
            <button onclick="window.print()" class="px-5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-semibold rounded-lg shadow-md hover:shadow-lg transition-all flex items-center gap-2 cursor-pointer">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path>
                </svg>
                Yazdır / PDF Kaydet
            </button>
        </div>
    </div>

    <!-- Main Printable A4 Container -->
    <div class="page-container p-6 sm:p-8 flex flex-col justify-between shadow-xl bg-white rounded-xl border border-slate-200">
        
        <!-- Header Section -->
        <header class="border-b-2 border-emerald-600 pb-3 mb-3">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                <div>
                    <h1 class="text-2xl font-black tracking-wider text-emerald-800 uppercase flex items-center gap-2">
                        <span>🛒</span> ALIŞVERİŞ LİSTESİ
                    </h1>
                </div>
                <div class="flex flex-wrap gap-4 sm:gap-6 text-xs font-semibold text-slate-600 w-full sm:w-auto justify-between sm:justify-end">
                    <div class="flex items-center gap-2">
                        <span>Tarih:</span>
                        <input type="text" id="header-date" placeholder="GG / AA / 2026" oninput="saveData()" class="border-b border-slate-400 w-28 text-center pb-0.5 focus:border-emerald-600 focus:outline-none bg-transparent">
                    </div>
                    <div class="flex items-center gap-2">
                        <span>Bütçe / Not:</span>
                        <input type="text" id="header-budget" placeholder="0 ₺" oninput="handleBudgetInput(this)" onblur="formatBudgetBlur(this)" class="border-b border-slate-400 w-32 text-right pb-0.5 pr-1 focus:border-emerald-600 focus:outline-none bg-transparent font-medium text-emerald-800">
                    </div>
                </div>
            </div>
        </header>

        <!-- Categories Grid (10 Categories) -->
        <main class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-3 flex-grow" id="categories-grid">
            <!-- Categories will be dynamically injected by JavaScript -->
        </main>

        <!-- Footer Section for Extra Notes -->
        <footer class="mt-3 pt-2 border-t border-slate-200">
            <div class="text-xs font-bold text-slate-700 mb-1 flex items-center justify-between">
                <span>Ekstra Notlar & Unutulmayacaklar:</span>
            </div>
            <textarea id="extra-notes" oninput="saveData()" rows="2" placeholder="Örn: Pazara uğramayı unutma, kuponları kullan..." class="w-full text-xs p-2 border border-slate-200 rounded focus:border-emerald-600 focus:outline-none resize-none bg-slate-50/50 focus:bg-white transition-all"></textarea>
        </footer>

    </div>

    <!-- Focused Zoom Mode Modal / Backdrop -->
    <div id="zoom-modal-backdrop" onclick="closeZoomModal(event)" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 no-print opacity-0">
        <div id="zoom-card-container" onclick="event.stopPropagation()" class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-emerald-100 transform scale-95 flex flex-col justify-between relative">
            <div class="flex items-center justify-between border-b pb-3 mb-4 border-slate-100">
                <div class="flex items-center gap-2">
                    <span class="text-xs font-bold px-2 py-0.5 bg-emerald-100 text-emerald-800 rounded-full">Bölüm Modu</span>
                    <h2 id="zoom-card-title" class="text-lg font-bold text-slate-800"></h2>
                </div>
                <button onclick="closeZoomModal()" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-500 hover:text-slate-800 flex items-center justify-center font-bold text-lg transition-all cursor-pointer">
                    ✕
                </button>
            </div>
            
            <!-- Dynamic Items Injection Area for Zoom View -->
            <div id="zoom-card-items" class="space-y-2 mb-6"></div>

            <div class="flex justify-end pt-3 border-t border-slate-100">
                <button onclick="closeZoomModal()" class="px-5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold rounded-lg shadow-md hover:shadow-lg transition-all cursor-pointer">
                    Tamamlandı (Kapat)
                </button>
            </div>
        </div>
    </div>

    <!-- Custom Modal for Confirmation -->
    <div id="confirm-modal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 no-print">
        <div class="bg-white rounded-xl max-w-sm w-full p-6 shadow-2xl border border-slate-100">
            <div class="text-center">
                <div class="w-12 h-12 bg-rose-100 text-rose-600 rounded-full flex items-center justify-center mx-auto mb-3">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                    </svg>
                </div>
                <h3 class="text-lg font-bold text-slate-800 mb-1">Tümünü Temizle?</h3>
                <p class="text-xs text-slate-500 mb-5">Listeye girmiş olduğunuz tüm maddeler ve notlar silinecektir. Bu işlem geri alınamaz.</p>
                <div class="flex gap-3">
                    <button onclick="closeModal()" class="flex-1 px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-lg transition-all">Vazgeç</button>
                    <button onclick="confirmClearAll()" class="flex-1 px-4 py-2 bg-rose-600 hover:bg-rose-700 text-white text-xs font-semibold rounded-lg shadow transition-all">Evet, Temizle</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Application Script -->
    <script>
        const categories = [
            "1. Meyve & Sebze",
            "2. Et, Tavuk & Balık",
            "3. Süt Ürünleri",
            "4. Hamur & Fırın",
            "5. Kuru Gıda & Bakliyat",
            "6. İçecekler",
            "7. Atıştırmalıklar",
            "8. Hazır & Donuk Gıda",
            "9. Temizlik Ürünleri",
            "10. Kişisel Bakım"
        ];

        const STORAGE_KEY = "alisveris_listesi_data_v1";
        let activeZoomCatIdx = null;

        // Budget Formatting Utility Functions
        function formatTurkishLira(rawDigits) {
            if (!rawDigits) return "";
            const number = parseInt(rawDigits, 10);
            if (isNaN(number)) return "";
            // Format number using Turkish locale thousands separator (dot or comma)
            const formattedNumber = number.toLocaleString('tr-TR');
            return `${formattedNumber} ₺`;
        }

        function handleBudgetInput(inputEl) {
            // Strip out everything except numeric digits
            const rawDigits = inputEl.value.replace(/\D/g, "");
            
            if (rawDigits === "") {
                inputEl.value = "";
            } else {
                inputEl.value = formatTurkishLira(rawDigits);
            }
            saveData();
        }

        function formatBudgetBlur(inputEl) {
            handleBudgetInput(inputEl);
        }

        // Initialize Grid Elements
        function renderGrid() {
            const gridContainer = document.getElementById("categories-grid");
            gridContainer.innerHTML = "";

            categories.forEach((catTitle, catIdx) => {
                const section = document.createElement("section");
                section.className = "category-card border border-slate-200 rounded p-2 flex flex-col bg-slate-50/50 cursor-pointer";
                section.onclick = (e) => {
                    // Prevent trigger when clicking input/checkbox directly
                    if (e.target.tagName !== 'INPUT') {
                        openZoomModal(catIdx);
                    }
                };

                let itemsHTML = "";
                for (let i = 1; i <= 10; i++) {
                    const itemId = `item_${catIdx}_${i}`;
                    const checkId = `check_${catIdx}_${i}`;
                    
                    itemsHTML += `
                        <div class="flex items-center item-input py-0.5 group">
                            <input type="checkbox" id="${checkId}" onchange="toggleCheck('${itemId}', '${checkId}')" class="mr-1.5 h-3.5 w-3.5 accent-emerald-600 rounded cursor-pointer flex-shrink-0">
                            <span class="text-slate-400 text-[10px] mr-1 w-4 text-right flex-shrink-0 font-medium">${i}.</span>
                            <input type="text" id="${itemId}" oninput="syncInput('${itemId}')" placeholder="..." class="w-full text-[11px] bg-transparent border-none focus:outline-none text-slate-800 placeholder-slate-300">
                        </div>
                    `;
                }

                section.innerHTML = `
                    <h2 onclick="openZoomModal(${catIdx}); event.stopPropagation();" class="text-xs font-bold bg-emerald-100 hover:bg-emerald-200 text-emerald-900 px-1.5 py-1 rounded mb-1.5 truncate flex items-center justify-between group-hover:bg-emerald-200 transition-colors cursor-pointer" title="Büyütmek için tıklayın">
                        <span>${catTitle}</span>
                        <span class="text-[10px] opacity-60 font-normal no-print">🔍</span>
                    </h2>
                    <div class="flex flex-col justify-between flex-grow text-[11px]">
                        ${itemsHTML}
                    </div>
                `;

                gridContainer.appendChild(section);
            });
        }

        // Open Focused Zoom Modal
        function openZoomModal(catIdx) {
            activeZoomCatIdx = catIdx;
            const modal = document.getElementById("zoom-modal-backdrop");
            const cardContainer = document.getElementById("zoom-card-container");
            const titleEl = document.getElementById("zoom-card-title");
            const itemsContainer = document.getElementById("zoom-card-items");

            titleEl.textContent = categories[catIdx];
            itemsContainer.innerHTML = "";

            for (let i = 1; i <= 10; i++) {
                const originalItemId = `item_${catIdx}_${i}`;
                const originalCheckId = `check_${catIdx}_${i}`;

                const originalInput = document.getElementById(originalItemId);
                const originalCheck = document.getElementById(originalCheckId);

                const itemRow = document.createElement("div");
                itemRow.className = "flex items-center item-input py-1.5 px-2 rounded-lg hover:bg-slate-50 transition-all border-b border-slate-100";
                
                const isChecked = originalCheck ? originalCheck.checked : false;
                const val = originalInput ? originalInput.value : "";

                itemRow.innerHTML = `
                    <input type="checkbox" id="zoom_${originalCheckId}" ${isChecked ? 'checked' : ''} onchange="syncZoomCheck('${originalItemId}', '${originalCheckId}', 'zoom_${originalCheckId}')" class="mr-3 h-4 w-4 accent-emerald-600 rounded cursor-pointer flex-shrink-0">
                    <span class="text-slate-400 text-xs mr-2 w-5 text-right flex-shrink-0 font-medium">${i}.</span>
                    <input type="text" id="zoom_${originalItemId}" value="${val.replace(/"/g, '&quot;')}" oninput="syncZoomInput('${originalItemId}', 'zoom_${originalItemId}')" placeholder="Madde ekle..." class="w-full text-sm bg-transparent border-none focus:outline-none text-slate-800 placeholder-slate-300 font-medium ${isChecked ? 'item-checked' : ''}">
                `;

                itemsContainer.appendChild(itemRow);
            }

            modal.classList.remove("hidden");
            // Trigger animation frame for CSS transition
            requestAnimationFrame(() => {
                modal.classList.remove("opacity-0");
                modal.classList.add("opacity-100");
                cardContainer.classList.remove("scale-95");
                cardContainer.classList.add("scale-100");
            });
        }

        // Close Zoom Modal
        function closeZoomModal(e) {
            if (e && e.target !== document.getElementById("zoom-modal-backdrop") && e.type === "click" && e.target.tagName !== "BUTTON") {
                return;
            }
            
            const modal = document.getElementById("zoom-modal-backdrop");
            const cardContainer = document.getElementById("zoom-card-container");

            modal.classList.remove("opacity-100");
            modal.classList.add("opacity-0");
            cardContainer.classList.remove("scale-100");
            cardContainer.classList.add("scale-95");

            setTimeout(() => {
                modal.classList.add("hidden");
                activeZoomCatIdx = null;
            }, 200);
        }

        // Sync inputs between Grid and Zoom Modal
        function syncInput(itemId) {
            const originalVal = document.getElementById(itemId)?.value || "";
            const zoomInput = document.getElementById(`zoom_${itemId}`);
            if (zoomInput) {
                zoomInput.value = originalVal;
            }
            saveData();
        }

        function syncZoomInput(originalItemId, zoomItemId) {
            const zoomVal = document.getElementById(zoomItemId)?.value || "";
            const originalInput = document.getElementById(originalItemId);
            if (originalInput) {
                originalInput.value = zoomVal;
            }
            saveData();
        }

        function syncZoomCheck(originalItemId, originalCheckId, zoomCheckId) {
            const isChecked = document.getElementById(zoomCheckId)?.checked || false;
            const originalCheck = document.getElementById(originalCheckId);
            const originalInput = document.getElementById(originalItemId);
            const zoomInput = document.getElementById(`zoom_${originalItemId}`);

            if (originalCheck) originalCheck.checked = isChecked;

            if (isChecked) {
                if (originalInput) originalInput.classList.add("item-checked");
                if (zoomInput) zoomInput.classList.add("item-checked");
            } else {
                if (originalInput) originalInput.classList.remove("item-checked");
                if (zoomInput) zoomInput.classList.remove("item-checked");
            }

            saveData();
        }

        // Toggle Strikethrough Effect
        function toggleCheck(itemId, checkId) {
            const inputEl = document.getElementById(itemId);
            const checkEl = document.getElementById(checkId);
            const zoomCheck = document.getElementById(`zoom_${checkId}`);
            const zoomInput = document.getElementById(`zoom_${itemId}`);

            if (checkEl.checked) {
                if (inputEl) inputEl.classList.add("item-checked");
                if (zoomInput) zoomInput.classList.add("item-checked");
                if (zoomCheck) zoomCheck.checked = true;
            } else {
                if (inputEl) inputEl.classList.remove("item-checked");
                if (zoomInput) zoomInput.classList.remove("item-checked");
                if (zoomCheck) zoomCheck.checked = false;
            }

            saveData();
        }

        // Save Data to LocalStorage
        function saveData() {
            const data = {
                headerDate: document.getElementById("header-date").value,
                headerBudget: document.getElementById("header-budget").value,
                extraNotes: document.getElementById("extra-notes").value,
                items: {},
                checks: {}
            };

            categories.forEach((_, catIdx) => {
                for (let i = 1; i <= 10; i++) {
                    const itemId = `item_${catIdx}_${i}`;
                    const checkId = `check_${catIdx}_${i}`;

                    const itemVal = document.getElementById(itemId)?.value || "";
                    const checkVal = document.getElementById(checkId)?.checked || false;

                    if (itemVal) data.items[itemId] = itemVal;
                    if (checkVal) data.checks[checkId] = true;
                }
            });

            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        }

        // Load Saved Data
        function loadData() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (!saved) return;

            try {
                const data = JSON.parse(saved);

                if (data.headerDate) document.getElementById("header-date").value = data.headerDate;
                if (data.headerBudget) document.getElementById("header-budget").value = data.headerBudget;
                if (data.extraNotes) document.getElementById("extra-notes").value = data.extraNotes;

                categories.forEach((_, catIdx) => {
                    for (let i = 1; i <= 10; i++) {
                        const itemId = `item_${catIdx}_${i}`;
                        const checkId = `check_${catIdx}_${i}`;

                        if (data.items && data.items[itemId]) {
                            const inputEl = document.getElementById(itemId);
                            if (inputEl) inputEl.value = data.items[itemId];
                        }

                        if (data.checks && data.checks[checkId]) {
                            const checkEl = document.getElementById(checkId);
                            if (checkEl) {
                                checkEl.checked = true;
                                toggleCheck(itemId, checkId);
                            }
                        }
                    }
                });
            } catch (e) {
                console.error("Kayıtlı veri yüklenirken hata oluştu:", e);
            }
        }

        // Clear All Data
        function clearAllData() {
            document.getElementById("confirm-modal").classList.remove("hidden");
        }

        function closeModal() {
            document.getElementById("confirm-modal").classList.add("hidden");
        }

        function confirmClearAll() {
            localStorage.removeItem(STORAGE_KEY);
            document.getElementById("header-date").value = "";
            document.getElementById("header-budget").value = "";
            document.getElementById("extra-notes").value = "";

            categories.forEach((_, catIdx) => {
                for (let i = 1; i <= 10; i++) {
                    const itemId = `item_${catIdx}_${i}`;
                    const checkId = `check_${catIdx}_${i}`;

                    const inputEl = document.getElementById(itemId);
                    const checkEl = document.getElementById(checkId);

                    if (inputEl) {
                        inputEl.value = "";
                        inputEl.classList.remove("item-checked");
                    }
                    if (checkEl) {
                        checkEl.checked = false;
                    }
                }
            });

            if (activeZoomCatIdx !== null) {
                openZoomModal(activeZoomCatIdx);
            }

            closeModal();
        }

        // Keyboard Shortcut: Close modal on Escape key
        window.addEventListener("keydown", (e) => {
            if (e.key === "Escape") {
                closeZoomModal();
                closeModal();
            }
        });

        // Initialize App on DOM Load
        window.addEventListener("DOMContentLoaded", () => {
            renderGrid();
            loadData();
        });
    </script>
</body>
</html>
